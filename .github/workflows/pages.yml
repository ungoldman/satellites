name: pages

on:
  push:
    branches:
      - main
  # fresh elements from CelesTrak, published with the page, as often as it asks
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
      - run: mkdir _site && cp src/index.html src/app.js src/coast.js src/fleet.js src/globe.js src/orbit.js src/terrain.js src/time.js src/view.js src/og.png _site/
      # carry the published copy forward, so a failed fetch redeploys the last
      # good one rather than dropping it
      - run: curl -fsS https://ungoldman.com/satellites/gp.json -o _site/gp.json || true
      - run: node src/elements.js _site/gp.json
      # the heights never change, so the published copies are kept and the
      # tiles are fetched only when one is missing
      - run: |
          for z in 2 3; do
            curl -fsS --remove-on-error https://ungoldman.com/satellites/terrain-$z.webp -o _site/terrain-$z.webp || true
          done
          if [ ! -s _site/terrain-2.webp ] || [ ! -s _site/terrain-3.webp ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq webp
          fi
      - run: node src/bake.js _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
